# ==============================================================================
# NGINX CONFIGURATION: OMPRAMANI PRODUCTION (FRONTEND + BACKEND)
# ==============================================================================

# 1. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name ompramani.vn www.ompramani.vn api.ompramani.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Frontend Next.js Application (https://ompramani.vn)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ompramani.vn www.ompramani.vn;

    # SSL Certificates (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/ompramani.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ompramani.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # Static Assets Caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # Reverse Proxy to Next.js Standalone Server (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

# 3. Backend Laravel REST API & Admin Panel (https://api.ompramani.vn)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ompramani.vn;

    root /var/www/ompramani/ompramani-api/public;
    index index.php;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/api.ompramani.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ompramani.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Request Size Limits
    client_max_body_size 16M;

    # Security: Deny access to hidden dotfiles (.env, .git, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Public Uploads & Media Serving
    location /storage/ {
        alias /var/www/ompramani/ompramani-api/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Health Check Endpoint
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # SePay IPN Webhook Endpoint (Direct pass to Laravel)
    location = /api/v1/shop/sepay/ipn {
        try_files $uri /index.php?$query_string;
        proxy_read_timeout 30s;
    }

    # Standard Application Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_read_timeout 60s;
    }
}
